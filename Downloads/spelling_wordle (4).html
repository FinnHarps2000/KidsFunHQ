<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Wordle</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#fdf6ec;--card:#fff;--correct:#5cb85c;--present:#f0ad4e;
    --absent:#b0b0b0;--empty:#e8e0d5;--border:#d4c9b8;--text:#3a2e22;
    --accent:#e86a3a;--accent2:#5b9bd5;--accent3:#9b59b6;
    --shadow:0 4px 18px rgba(60,40,10,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px 40px}
  body::before{content:'';position:fixed;inset:0;
    background-image:radial-gradient(circle,#d4c9b8 1.5px,transparent 1.5px);
    background-size:28px 28px;opacity:.45;pointer-events:none;z-index:0}
  .container{position:relative;z-index:1;width:100%;max-width:600px;
    display:flex;flex-direction:column;align-items:center;gap:20px}
  header{text-align:center}
  h1{font-family:'Fredoka One',cursive;font-size:2.6rem;color:var(--accent);
    letter-spacing:1px;text-shadow:3px 3px 0 #f7d0b8}
  .subtitle{font-size:1rem;color:#8a7a68;font-weight:600;margin-top:4px}
  .btn{padding:10px 22px;border:none;border-radius:12px;font-family:'Fredoka One',cursive;
    font-size:1.05rem;cursor:pointer;transition:transform .1s,box-shadow .1s;letter-spacing:.5px}
  .btn:active{transform:translateY(2px)}
  .btn-add{background:var(--accent2);color:#fff;box-shadow:0 3px 0 #3a7ab0}
  .btn-add:active{box-shadow:none}
  .btn-start{background:var(--accent);color:#fff;box-shadow:0 3px 0 #b84d1f;
    font-size:1.15rem;padding:13px 32px;width:100%;margin-top:4px}
  .btn-start:active{box-shadow:none}
  .btn-review{background:var(--accent3);color:#fff;box-shadow:0 3px 0 #6c3483;
    font-size:1.15rem;padding:13px 32px;width:100%}
  .btn-review:active{box-shadow:none}
  .btn-next{background:var(--accent2);color:#fff;box-shadow:0 3px 0 #3a7ab0;
    font-size:1.1rem;padding:11px 28px}
  .btn-next:active{box-shadow:none}
  .btn-sm{background:#f0ece4;color:var(--text);border:2px solid var(--border);
    font-size:.85rem;padding:6px 14px;border-radius:8px}
  .btn-danger{background:#fde8e8;color:#c0392b;border:2px solid #f5c6c6}
  .setup-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:28px 32px;width:100%;display:flex;flex-direction:column;gap:16px}
  .setup-card label{font-weight:800;font-size:1rem;color:var(--text);margin-bottom:4px;display:block}
  .word-list-area{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .word-list-area input[type="text"]{flex:1;min-width:140px;padding:10px 16px;
    border:2.5px solid var(--border);border-radius:12px;font-size:1.1rem;
    font-family:'Nunito',sans-serif;font-weight:700;color:var(--text);
    background:var(--bg);outline:none;transition:border-color .2s;text-transform:uppercase}
  .word-list-area input:focus{border-color:var(--accent2)}
  .word-chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#f0ece4;border:2px solid var(--border);border-radius:8px;
    padding:5px 12px;font-weight:700;font-size:.95rem;
    display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:1px}
  .chip button{background:none;border:none;cursor:pointer;font-size:.85rem;
    color:#b0a090;padding:0;line-height:1;font-weight:800}
  .chip button:hover{color:var(--accent)}
  .divider{border:none;border-top:2px dashed var(--border);margin:4px 0}
  .history-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:20px 24px;width:100%;display:flex;flex-direction:column;gap:12px}
  .history-header{display:flex;justify-content:space-between;align-items:center}
  .history-title{font-family:'Fredoka One',cursive;font-size:1.2rem;color:var(--accent3)}
  .history-count{font-size:.85rem;font-weight:700;color:#8a7a68;
    background:var(--bg);border-radius:8px;padding:3px 10px}
  .history-grid{display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow-y:auto}
  .history-chip{background:#f0ece4;border:2px solid var(--border);border-radius:8px;
    padding:4px 10px;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:1px;
    display:flex;align-items:center;gap:6px;cursor:default}
  .history-chip.mastered{border-color:var(--correct);background:#edfaed;color:#256b35}
  .history-chip.struggled{border-color:#f0a060;background:#fff4ea;color:#a05010}
  .history-chip .chip-remove{background:none;border:none;cursor:pointer;
    font-size:.75rem;color:#b0a090;padding:0;line-height:1}
  .history-chip .chip-remove:hover{color:#c0392b}
  .empty-history{font-size:.95rem;color:#b0a090;font-weight:600;text-align:center;padding:8px 0}
  .review-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .review-row label{font-weight:700;font-size:.95rem;color:#8a7a68}
  .review-row input[type="range"]{flex:1;min-width:80px;accent-color:var(--accent3)}
  .review-count-display{font-family:'Fredoka One',cursive;font-size:1.1rem;
    color:var(--accent3);min-width:28px;text-align:center}
  .clue-banner{width:100%;background:linear-gradient(135deg,#e8f4fd,#d0eaf8);
    border:2.5px solid #a8d4f0;border-radius:16px;
    padding:14px 20px;display:flex;gap:12px;align-items:flex-start;min-height:58px}
  .clue-icon{font-size:1.5rem;flex-shrink:0;line-height:1.3}
  .clue-text{font-size:1.05rem;font-weight:700;color:#1a5a8a;line-height:1.4}
  .clue-loading{display:flex;align-items:center;gap:8px;color:#6a9fc0;font-weight:600;font-size:.95rem}
  .dot-pulse span{display:inline-block;width:7px;height:7px;background:#6a9fc0;
    border-radius:50%;animation:dotPulse 1.2s infinite;margin:0 2px}
  .dot-pulse span:nth-child(2){animation-delay:.2s}
  .dot-pulse span:nth-child(3){animation-delay:.4s}
  @keyframes dotPulse{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1);opacity:1}}
  .hint-box{width:100%;background:linear-gradient(135deg,#fff8e1,#fff3cd);
    border:2.5px solid #f0c060;border-radius:14px;
    padding:12px 18px;display:flex;gap:10px;align-items:flex-start;
    animation:slideIn .3s ease;min-height:48px}
  .hint-box.hidden{display:none!important}
  .hint-icon{font-size:1.3rem;flex-shrink:0}
  .hint-text{font-size:.98rem;font-weight:700;color:#7a5a00;line-height:1.4}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .game-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:22px 24px 24px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
  .game-header{display:flex;justify-content:space-between;align-items:center;width:100%}
  .word-counter,.tries-display{font-size:.95rem;font-weight:700;color:#8a7a68;
    background:var(--bg);border-radius:10px;padding:5px 14px}
  .mode-badge{font-family:'Fredoka One',cursive;font-size:.85rem;
    padding:4px 12px;border-radius:20px;letter-spacing:.5px}
  .mode-badge.review{background:#ede0f8;color:var(--accent3);border:2px solid #c9a0e8}
  .grid{display:flex;flex-direction:column;gap:8px}
  .grid-row{display:flex;gap:8px}
  .tile{width:58px;height:58px;border-radius:10px;display:flex;align-items:center;
    justify-content:center;font-family:'Fredoka One',cursive;font-size:1.7rem;
    text-transform:uppercase;border:3px solid var(--border);background:var(--empty);
    color:transparent;transition:background .35s,border-color .35s,color .35s,transform .15s}
  .tile.filled{border-color:#b8a898;color:var(--text);background:#fff}
  .tile.correct{background:var(--correct);border-color:var(--correct);color:#fff}
  .tile.present{background:var(--present);border-color:var(--present);color:#fff}
  .tile.absent{background:var(--absent);border-color:var(--absent);color:#fff}
  .tile.pop{animation:pop .1s ease}
  .tile.flip{animation:flip .5s ease forwards}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
  .keyboard{display:flex;flex-direction:column;gap:7px;width:100%}
  .key-row{display:flex;justify-content:center;gap:5px}
  .key{height:52px;min-width:36px;border-radius:8px;border:none;background:#e8e0d5;
    font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;
    transition:background .25s,color .25s,transform .1s;color:var(--text);
    padding:0 6px;flex:1;max-width:42px}
  .key.wide{max-width:64px;font-size:.8rem;letter-spacing:.5px}
  .key:active{transform:translateY(2px)}
  .key.correct{background:var(--correct);color:#fff}
  .key.present{background:var(--present);color:#fff}
  .key.absent{background:var(--absent);color:#fff}
  .message{font-family:'Fredoka One',cursive;font-size:1.3rem;text-align:center;
    padding:10px 20px;border-radius:14px;min-height:44px;width:100%;transition:opacity .3s}
  .message.success{background:#d4edda;color:#256b35}
  .message.fail{background:#fde8e8;color:#c0392b}
  .message.hint{background:#fff3cd;color:#856404}
  .message.empty{opacity:0}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .shake{animation:shake .4s ease}
  @keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}60%{transform:translateY(-5px)}}
  .bounce-row .tile{animation:bounce .6s ease}
  .bounce-row .tile:nth-child(1){animation-delay:.00s}.bounce-row .tile:nth-child(2){animation-delay:.08s}
  .bounce-row .tile:nth-child(3){animation-delay:.16s}.bounce-row .tile:nth-child(4){animation-delay:.24s}
  .bounce-row .tile:nth-child(5){animation-delay:.32s}.bounce-row .tile:nth-child(6){animation-delay:.40s}
  .bounce-row .tile:nth-child(7){animation-delay:.48s}.bounce-row .tile:nth-child(8){animation-delay:.56s}
  .bounce-row .tile:nth-child(9){animation-delay:.64s}
  .finish-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    padding:36px 32px;width:100%;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:16px}
  .finish-card h2{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--accent)}
  .results-grid{display:flex;flex-direction:column;gap:6px;width:100%}
  .result-row{display:flex;justify-content:space-between;align-items:center;
    background:var(--bg);border-radius:10px;padding:8px 16px;font-weight:700}
  .result-word{text-transform:uppercase;letter-spacing:1px;font-size:1.05rem}
  .result-score{font-size:1.1rem}
  .finish-btns{display:flex;gap:12px;width:100%;flex-wrap:wrap}
  .finish-btns .btn{flex:1}
  .stars{display:flex;gap:6px;font-size:1.5rem}
  .hidden{display:none!important}
  @media(max-width:420px){.tile{width:44px;height:44px;font-size:1.3rem}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔤 Spelling Wordle</h1>
    <div class="subtitle">A spelling game for budding champions!</div>
  </header>

  <div class="setup-card" id="setupScreen">
    <div>
      <label>Add words to practise:</label>
      <div class="word-list-area">
        <input type="text" id="wordInput" placeholder="e.g. WEDDING" maxlength="12"/>
        <button class="btn btn-add" onclick="addWord()">+ Add</button>
      </div>
    </div>
    <div class="word-chips" id="wordChips"></div>
    <button class="btn btn-start" onclick="startGame(false)" id="startBtn" disabled>▶ Start New Game</button>
  </div>

  <div class="history-card" id="historyPanel">
    <div class="history-header">
      <div class="history-title">📚 Word Bank</div>
      <div class="history-count" id="historyCount">0 words</div>
    </div>
    <div class="history-grid" id="historyGrid">
      <div class="empty-history">No words saved yet — play a game to start building your word bank!</div>
    </div>
    <hr class="divider">
    <div class="review-row">
      <label>Review:</label>
      <input type="range" id="reviewCount" min="1" max="10" value="5" oninput="updateReviewCount()">
      <div class="review-count-display" id="reviewCountDisplay">5</div>
      <span style="font-size:.9rem;font-weight:700;color:#8a7a68">words</span>
    </div>
    <button class="btn btn-review" onclick="startReview()" id="reviewBtn" disabled>🎲 Random Review</button>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sm btn-danger" onclick="clearHistory()" id="clearBtn" style="display:none">🗑 Clear Word Bank</button>
    </div>
  </div>

  <div class="game-card hidden" id="gameScreen">
    <div class="game-header">
      <div class="word-counter" id="wordCounter">Word 1 of 1</div>
      <div id="modeBadgeWrap"></div>
      <div class="tries-display" id="triesDisplay">Tries: 0 / 6</div>
    </div>
    <div class="clue-banner">
      <div class="clue-icon">🔍</div>
      <div id="clueContent"><div class="clue-loading"><span>Loading clue</span><div class="dot-pulse"><span></span><span></span><span></span></div></div></div>
    </div>
    <div class="hint-box hidden" id="hintBox">
      <div class="hint-icon">💡</div>
      <div class="hint-text" id="hintText"></div>
    </div>
    <div class="message empty" id="message"></div>
    <div class="grid" id="grid"></div>
    <div class="keyboard" id="keyboard"></div>
    <div style="display:flex;gap:12px;justify-content:center;width:100%">
      <button class="btn btn-next hidden" id="nextBtn" onclick="nextWord()">Next Word →</button>
    </div>
  </div>

  <div class="finish-card hidden" id="finishScreen">
    <div class="stars" id="finishStars"></div>
    <h2>All done! 🎉</h2>
    <div id="finishMessage" style="font-size:1.05rem;color:#8a7a68;font-weight:600;"></div>
    <div class="results-grid" id="resultsGrid"></div>
    <div class="finish-btns">
      <button class="btn btn-review" onclick="startReview()">🎲 Review Again</button>
      <button class="btn btn-start" onclick="goHome()">🏠 Home</button>
    </div>
  </div>
</div>
<script>
// ═══════════════════════════════════════════
// STATIC WORD DICTIONARY
// Each word has: clue + hints[] per tricky pattern
// hints are arrays — first is shown by default, rest rotate in
// ═══════════════════════════════════════════
const DICT = {
  // Format: { clue, patterns: { "LETTERS": "hint about that specific pattern" }, hints: ["fallback hints in order"] }
  // patterns keys are substrings of the word that, if wrong, trigger that specific hint
  "COME":    { clue:"You do this when someone calls your name across the room. What's the word?", patterns:{"OME":"Watch out — the O in COME says /u/ like 'sun', not /o/ like 'home'!","E":"Don't forget the silent E at the end: C-O-M-E."}, hints:["Remember: COME ends with a silent E — C-O-M-E.","The O sounds like /u/ — unusual for a word with silent E!","Think: come, some, done — these O's all say /u/."] },
  "SOME":    { clue:"Not all, and not none — just a little bit of something. What's the word?", patterns:{"OME":"Watch out — the O in SOME says /u/ like 'sun', not /o/!","E":"Don't forget the silent E: S-O-M-E."}, hints:["Remember: S-O-M-E — the O says /u/, not /o/.","Think: some, come, done — unusual O sounds.","Don't forget the silent E at the end."] },
  "SAID":    { clue:"When words come out of your mouth, you have ___ something. What's the word?", patterns:{"AI":"Watch out! The AI in SAID says /e/ like 'bed' — not /ay/ like 'rain'.","AID":"The middle is A-I-D, but the AI sounds like /e/.","SA":"It starts with S-A, even though it sounds like /se/."},hints:["Remember: S-A-I-D — the AI makes an /e/ sound, not /ay/.","Think: SAID rhymes with 'bed', not 'paid'.","Don't forget the I — it's there even though it's quiet."] },
  "HAVE":    { clue:"You do this with toys, pets, and friends — they belong to you! What's the word?", patterns:{"VE":"Remember: words don't end in just V in English — the silent E is needed: H-A-V-E.","HAV":"It's not HAF — the /f/ sound here is spelled V-E."},hints:["Remember: H-A-V-E — the VE ending, not just V.","The E is silent but essential — without it we'd have 'hav'!","Think: have, give, live — they all end in VE."] },
  "WERE":    { clue:"Yesterday you played outside. You ___ having so much fun! What's the missing word?", patterns:{"ERE":"Remember: W-E-R-E — the ERE says /er/, not /eer/.","WER":"It's W-E-R, not W-U-R."},hints:["Remember: W-E-R-E — two E's, one at each end.","The middle sounds like /er/ — spelled E-R.","Don't mix it up with 'where' — that's a different word!"] },
  "THEY":    { clue:"More than one person, but not 'we'. What word do we use for other people?", patterns:{"TH":"Remember: THEY starts with TH — two letters, one sound.","EY":"The ending is EY saying /ay/ — not AY.","HE":"THEY contains HE — but it says /ay/ at the end!"},hints:["Remember: T-H-E-Y — TH at the start, EY at the end.","The EY says /ay/ — like 'grey' or 'hey'.","Think: THEY contains HEY!"] },
  "WHAT":    { clue:"You say this to ask about something you don't know yet. ___ is that thing?", patterns:{"WH":"Remember: WHAT starts with WH — the H changes the W sound.","WHA":"The A in WHAT sounds like /o/ — W-H-A-T."},hints:["Remember: W-H-A-T — WH at the start.","The A sounds like /o/ — 'whot'!","Think: what, where, when, why — question words love WH."] },
  "THERE":   { clue:"Something is far away — it's over ___. Point and say the word!", patterns:{"HERE":"HERE is hiding inside THERE — T + HERE!","ERE":"The middle is E-R-E — two E's around an R.","E":"Don't forget the silent E at the very end."},hints:["Remember: THERE = T + HERE — HERE is hiding inside!","W-H-E-R-E = 'where', T-H-E-R-E = 'there'.","Don't forget the silent E at the end."] },
  "THEIR":   { clue:"It belongs to them — it's ___ toy. What's the word?", patterns:{"EIR":"The ending is E-I-R — E before I here.","HEI":"Watch out for EI — it's E then I, not I then E."},hints:["Remember: T-H-E-I-R — E before I in this word.","Think: 'i before e EXCEPT after...' — this is an exception!","Don't mix it with 'there' — THEIR means belonging to them."] },
  "ABOUT":   { clue:"A book can be ___ dogs, space, or cooking. What's that little word?", patterns:{"OU":"The OU in ABOUT makes an /ow/ sound — like in 'out'.","OUT":"ABOUT has OUT hiding at the end — ab-OUT!"},hints:["Remember: A-B-O-U-T — the OU says /ow/.","Think: ABOUT contains OUT — ab-OUT!","Don't write ABOWT — it's OU not OW."] },
  "HOUSE":   { clue:"You sleep here, eat here, and call it home every day. What is it?", patterns:{"OU":"The OU says /ow/ — like in 'out' and 'cloud'. You already have it right!","SE":"The ending is S-E — not just S, and not Z-E.","USE":"The end is -USE — H-O-USE."},hints:["Remember: H-O-U-S-E — OU says /ow/, silent E at the end.","The S sounds like /z/ but is still spelled S.","Think: house, mouse, louse — OU + SE pattern."] },
  "WOULD":   { clue:"You say this when offering help: ___ you like a hand?", patterns:{"OUL":"There's a silent L hiding in WOULD — W-O-U-L-D.","WOU":"The WOU sounds like /woo/ — the L is completely silent!"},hints:["Remember: W-O-U-L-D — the L is silent!","Think: could, would, should — they all hide a silent L.","Say it: /wood/ — but write W-O-U-L-D."] },
  "COULD":   { clue:"When you're able to do something, you say 'I ___ do it!' What's the word?", patterns:{"OUL":"Silent L in COULD — C-O-U-L-D.","COU":"The COU sounds like /coo/ — C-O-U."},hints:["Remember: C-O-U-L-D — the L is completely silent.","Think: could, would, should — silent L siblings!","Say /kood/ but write C-O-U-L-D."] },
  "SHOULD":  { clue:"When something is the right thing to do, you say you ___ do it.", patterns:{"SH":"SHOULD starts with SH — one sound, two letters.","OUL":"Silent L: S-H-O-U-L-D."},hints:["Remember: S-H-O-U-L-D — SH at the start, silent L inside.","Think: should, could, would — the silent L trio!","SH says /sh/ like 'ship', then -ould."] },
  "FRIEND":  { clue:"Someone you play with, laugh with, and share secrets with. What are they?", patterns:{"IE":"FRIEND has IE — I before E: F-R-I-E-N-D.","IEN":"The middle is I-E-N — watch those vowels!"},hints:["Remember: F-R-I-E-N-D — I before E.","Don't skip the IE vowel pair in the middle!","Think: fri-END — the END is at the end!"] },
  "PEOPLE":  { clue:"Lots of humans all together — a crowd of them. What's the word?", patterns:{"EO":"There's an E-O in the middle — P-E-O-P-L-E.","PLE":"The ending is -PLE, saying /pul/."},hints:["Remember: P-E-O-P-L-E — two P's and two E's!","The -PLE ending sounds like /pul/.","Think: peo-PLE — the PLE ending is like 'apple', 'table'."] },
  "BECAUSE": { clue:"You use this word to explain why. I'm happy ___ it's sunny! What's the word?", patterns:{"AU":"The AU in BECAUSE says /aw/ or /uh/ — B-E-C-A-U-S-E.","CAUS":"The middle is C-A-U-S — watch for the AU."},hints:["Remember: B-E-C-A-U-S-E — AU in the middle.","Break it up: be-CAUSE.","The -AUSE sounds like 'awz'."] },
  "NIGHT":   { clue:"The sun has gone down, the stars are out, and it's dark outside. What time is it?", patterns:{"IGH":"The IGH says /ī/ — G and H are both silent: N-I-G-H-T.","GH":"The GH after I is completely silent!"},hints:["Remember: N-I-G-H-T — IGH says /ī/, GH is silent.","Think: night, light, right, fight — the IGH family.","Don't write NITE — the GH is hidden but real."] },

// SMART HINT ENGINE
// Looks at exactly what the child got wrong vs right
// and returns the most useful coaching message
// ═══════════════════════════════════════════
function buildHint(word, guess, result) {
  const entry = DICT[word.toUpperCase()];

  // ── 1. Work out what's right and what's wrong ──
  const correctPositions = [];
  const wrongPositions   = [];
  for (let i = 0; i < word.length; i++) {
    if (result[i] === 'correct') {
      correctPositions.push({ i, letter: word[i] });
    } else {
      wrongPositions.push({ i, expected: word[i], got: guess[i] || '' });
    }
  }

  // ── 2. Build "what you got right" part ──
  let rightPart = '';
  if (correctPositions.length > 0 && correctPositions.length < word.length) {
    // Find runs of correct letters to describe naturally
    const correctLetters = correctPositions.map(p => p.letter.toUpperCase()).join('');
    if (correctPositions.length === 1) {
      rightPart = `You got the "${correctLetters}" right! `;
    } else if (correctPositions.length <= 3) {
      rightPart = `You got "${correctLetters}" right! `;
    } else {
      rightPart = `You've got ${correctPositions.length} letters right already! `;
    }
  }

  // ── 3. Find the most relevant pattern-specific hint ──
  let patternHint = '';
  if (entry && entry.patterns) {
    // Find which patterns in the word match what was guessed wrong
    // A pattern is "relevant" if:
    //   (a) it appears in the word AND
    //   (b) the child got at least one letter of that pattern wrong
    const wrongIndices = new Set(wrongPositions.map(p => p.i));

    let bestPattern = null;
    let bestScore   = -1;

    for (const [pattern, hint] of Object.entries(entry.patterns)) {
      // Find where this pattern sits in the word
      const wLower = word.toLowerCase();
      const pLower = pattern.toLowerCase();
      const idx    = wLower.indexOf(pLower);
      if (idx === -1) continue;

      // Count how many letters of this pattern are wrong
      let wrongInPattern = 0;
      let rightInPattern = 0;
      for (let j = 0; j < pattern.length; j++) {
        if (wrongIndices.has(idx + j)) wrongInPattern++;
        else rightInPattern++;
      }

      // Score: prioritise patterns where something went wrong
      // but don't suggest a pattern the child already has completely right
      if (wrongInPattern === 0) continue; // child already nailed this pattern
      const score = wrongInPattern * 2 - rightInPattern;
      if (score > bestScore) { bestScore = score; bestPattern = hint; }
    }

    if (bestPattern) patternHint = bestPattern;
  }

  // ── 4. Fall back to ordered generic hints if no pattern match ──
  if (!patternHint && entry && entry.hints) {
    // Pick the next unused hint from the list
    const usedCount = typeof window._hintIndex === 'undefined' ? 0 : window._hintIndex;
    patternHint = entry.hints[usedCount % entry.hints.length];
    window._hintIndex = (usedCount + 1);
  }

  // ── 5. If word not in dictionary, ask Claude ──
  if (!patternHint) return null; // triggers API fallback

  return rightPart + patternHint;
}

// ═══════════════════════════════════════════
// API HELPER (only fires for unknown words)
// ═══════════════════════════════════════════
async function callClaude(prompt, maxTokens = 400) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": "claude-web",
      "anthropic-version": "2023-06-01"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: maxTokens,
      messages: [{ role: "user", content: prompt }]
    })
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  return data.content.map(i => i.text || '').join('').trim();
}

// ═══════════════════════════════════════════
// WORD DATA LOADER
// Uses DICT first; falls back to API for unknowns
// ═══════════════════════════════════════════
async function generateWordData(words) {
  const result = {};
  const needsAPI = [];

  words.forEach(w => {
    const upper = w.toUpperCase();
    if (DICT[upper]) {
      result[upper] = { clue: DICT[upper].clue, hints: DICT[upper].hints };
    } else if (wordBank[upper] && wordBank[upper].clue) {
      result[upper] = { clue: wordBank[upper].clue, hints: wordBank[upper].hints };
    } else {
      needsAPI.push(upper);
    }
  });

  if (needsAPI.length === 0) return result;

  const wordDetails = needsAPI.map(w => `- ${w} (${w.length} letters)`).join('\n');
  const prompt = `You are an expert literacy teacher helping children aged 6-9 learn to spell.

For each word below, produce:
1. "clue": A vivid question a child aged 6-9 can answer. The answer IS the word. NEVER mention the word itself, NEVER mention letter count. Make it fun and concrete — reference what the thing looks, feels, sounds or does.
2. "hints": Exactly 3 word-specific spelling hints. Each must name the exact letters or pattern (e.g. "the OU in house", "the silent GH"). Under 20 words each. Start with Remember/Don't forget/Think about/Watch out for. DO NOT invent patterns that aren't in the word.

Words:
${wordDetails}

Respond ONLY with valid JSON, no markdown:
{"WORD":{"clue":"...","hints":["...","...","..."]}}`;

  try {
    const text  = await callClaude(prompt, 800);
    const clean = text.replace(/```json|```/g,'').trim();
    const fresh = JSON.parse(clean);
    Object.assign(result, fresh);
  } catch(e) {
    console.error('API fallback failed:', e);
    needsAPI.forEach(w => {
      result[w] = {
        clue: `Can you spell this word? Give it your best shot!`,
        hints: ["Say the word slowly and think about each sound.", "Check the beginning and end carefully.", "Think about any unusual letter patterns."]
      };
    });
  }
  return result;
}

// ═══════════════════════════════════════════
// LIVE HINT — called after each wrong guess
// ═══════════════════════════════════════════
async function getSpellingHint(word, guess, result) {
  window._hintIndex = window._hintIndex || 0;

  // Try static hint engine first
  const staticHint = buildHint(word, guess, result);
  if (staticHint) return staticHint;

  // Fall back to API for unknown words
  const errors = [];
  const correct = [];
  for (let i = 0; i < word.length; i++) {
    if (result[i] === 'correct') correct.push(`"${word[i]}" at position ${i+1}`);
    else errors.push(`position ${i+1}: wrote "${guess[i]||'?'}", correct is "${word[i]}"`);
  }

  const rightPart = correct.length > 0
    ? `You got ${correct.join(', ')} right already. `
    : '';

  try {
    const hint = await callClaude(
      `A child (aged 6-9) learning to spell "${word}" guessed "${guess}".
${rightPart}Errors: ${errors.join('; ')}.
Write ONE encouraging coaching tip (max 18 words) about their specific mistake — name the exact letters involved.
Start with Remember/Don't forget/Think about/Watch out for. Reply with only the tip.`, 100);
    return rightPart + hint;
  } catch { return null; }
}

// ═══════════════════════════════════════════
// PERSISTENT STORAGE
// ═══════════════════════════════════════════
const STORAGE_KEY = 'spellingWordle_wordBank_v2';
function loadWordBank() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function saveWordBank(bank) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(bank)); } catch {} }
let wordBank = loadWordBank();

function upsertWordBank(word, data, solved) {
  const ex = wordBank[word] || { clue:'', hints:[], timesPlayed:0, timesSolved:0, lastPlayed:null };
  wordBank[word] = {
    clue: data.clue || ex.clue,
    hints: data.hints || ex.hints,
    timesPlayed: ex.timesPlayed + 1,
    timesSolved: ex.timesSolved + (solved ? 1 : 0),
    lastPlayed: new Date().toISOString()
  };
  saveWordBank(wordBank);
}

// ═══════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════
let wordList = [], wordIndex = 0, currentWord = '', currentGuess = '';
let currentRow = 0, maxRows = 6, gameOver = false;
let results = [], keyStates = {}, wordData = {}, isReviewMode = false;

const KEYBOARD_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','⌫']
];

// ═══════════════════════════════════════════
// SETUP UI
// ═══════════════════════════════════════════
document.getElementById('wordInput').addEventListener('keydown', e => { if (e.key==='Enter') addWord(); });

function addWord() {
  const input = document.getElementById('wordInput');
  const word = input.value.trim().toUpperCase().replace(/[^A-Z]/g,'');
  if (!word || word.length < 2) { input.value=''; return; }
  if (wordList.includes(word)) { input.value=''; return; }
  wordList.push(word); input.value='';
  renderSetupChips();
  document.getElementById('startBtn').disabled = wordList.length === 0;
}
function removeFromSetup(word) {
  wordList = wordList.filter(w => w !== word);
  renderSetupChips();
  document.getElementById('startBtn').disabled = wordList.length === 0;
}
function renderSetupChips() {
  document.getElementById('wordChips').innerHTML = wordList.map(w =>
    `<div class="chip">${w} <button onclick="removeFromSetup('${w}')">✕</button></div>`).join('');
}

// ═══════════════════════════════════════════
// HISTORY / WORD BANK UI
// ═══════════════════════════════════════════
function renderHistoryPanel() {
  const words = Object.keys(wordBank);
  document.getElementById('historyCount').textContent = `${words.length} word${words.length!==1?'s':''}`;
  const grid = document.getElementById('historyGrid');
  const reviewBtn = document.getElementById('reviewBtn');
  const clearBtn  = document.getElementById('clearBtn');
  if (words.length === 0) {
    grid.innerHTML = '<div class="empty-history">No words saved yet — play a game to start building your word bank!</div>';
    reviewBtn.disabled = true; clearBtn.style.display = 'none'; return;
  }
  const sorted = words.sort((a,b) => new Date(wordBank[b].lastPlayed) - new Date(wordBank[a].lastPlayed));
  grid.innerHTML = sorted.map(w => {
    const d = wordBank[w];
    const rate = d.timesPlayed > 0 ? d.timesSolved / d.timesPlayed : 0;
    const cls  = rate >= 0.7 ? 'mastered' : d.timesPlayed > 1 ? 'struggled' : '';
    const icon = rate >= 0.7 ? '✅' : (d.timesPlayed > 1 && rate < 0.5) ? '🔄' : '';
    return `<div class="history-chip ${cls}" title="Played ${d.timesPlayed}x, solved ${d.timesSolved}x">
      ${icon?`<span>${icon}</span>`:''}${w}
      <button class="chip-remove" onclick="removeFromBank('${w}')">✕</button></div>`;
  }).join('');
  const slider = document.getElementById('reviewCount');
  slider.max = Math.min(words.length, 20);
  if (parseInt(slider.value) > slider.max) slider.value = slider.max;
  updateReviewCount();
  reviewBtn.disabled = false;
  clearBtn.style.display = 'block';
}
function removeFromBank(word) {
  if (!confirm(`Remove "${word}" from your word bank?`)) return;
  delete wordBank[word]; saveWordBank(wordBank); renderHistoryPanel();
}
function clearHistory() {
  if (!confirm('Clear the entire word bank? This cannot be undone.')) return;
  wordBank = {}; saveWordBank(wordBank); renderHistoryPanel();
}
function updateReviewCount() {
  document.getElementById('reviewCountDisplay').textContent = document.getElementById('reviewCount').value;
}

// ═══════════════════════════════════════════
// GAME START
// ═══════════════════════════════════════════
async function startGame(reviewMode) {
  isReviewMode = reviewMode;
  wordIndex = 0; results = []; wordData = {};
  window._hintIndex = 0;

  if (!reviewMode) {
    wordList = [...wordList].sort(() => Math.random() - 0.5);
  } else {
    const bankWords = Object.keys(wordBank);
    const count = parseInt(document.getElementById('reviewCount').value);
    wordList = pickReviewWords(bankWords, count);
  }

  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('historyPanel').classList.add('hidden');
  document.getElementById('finishScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('modeBadgeWrap').innerHTML = isReviewMode
    ? '<div class="mode-badge review">🎲 Review Mode</div>' : '';

  loadWord();

  const generated = await generateWordData(wordList);
  wordData = generated;
  if (wordIndex === 0 && wordData[currentWord]) showClue(currentWord);
}

function pickReviewWords(bankWords, count) {
  const weighted = [];
  bankWords.forEach(w => {
    const d = wordBank[w];
    const rate = d.timesPlayed > 0 ? d.timesSolved / d.timesPlayed : 0;
    const weight = rate < 0.5 ? 3 : rate < 0.8 ? 2 : 1;
    for (let i = 0; i < weight; i++) weighted.push(w);
  });
  const shuffled = weighted.sort(() => Math.random() - 0.5);
  const picked = [];
  for (const w of shuffled) { if (!picked.includes(w)) picked.push(w); if (picked.length >= count) break; }
  return picked;
}
function startReview() { if (Object.keys(wordBank).length === 0) return; startGame(true); }

// ═══════════════════════════════════════════
// WORD LOADING
// ═══════════════════════════════════════════
function loadWord() {
  currentWord = wordList[wordIndex];
  currentGuess = ''; currentRow = 0; gameOver = false; keyStates = {};
  window._hintIndex = 0;

  document.getElementById('wordCounter').textContent = `Word ${wordIndex+1} of ${wordList.length}`;
  document.getElementById('triesDisplay').textContent = `Tries: 0 / ${maxRows}`;
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('hintBox').classList.add('hidden');
  setMessage('','');

  // DICT words show clue immediately — no loading delay
  const upper = currentWord.toUpperCase();
  if (DICT[upper]) {
    document.getElementById('clueContent').innerHTML = `<div class="clue-text">${DICT[upper].clue}</div>`;
  } else if (wordData[upper]) {
    showClue(upper);
  } else {
    document.getElementById('clueContent').innerHTML = `<div class="clue-loading"><span>Loading clue</span><div class="dot-pulse"><span></span><span></span><span></span></div></div>`;
  }
  buildGrid(); buildKeyboard();
}
function showClue(word) {
  const data = wordData[word];
  if (!data) return;
  document.getElementById('clueContent').innerHTML = `<div class="clue-text">${data.clue}</div>`;
}

// ═══════════════════════════════════════════
// GRID
// ═══════════════════════════════════════════
function buildGrid() {
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  const len = currentWord.length;
  const tileSize = len<=6?58:len<=8?50:len<=10?44:38;
  const fontSize = len<=6?1.7:len<=8?1.4:1.1;
  for (let r=0;r<maxRows;r++) {
    const row = document.createElement('div'); row.className='grid-row'; row.id=`row-${r}`;
    for (let c=0;c<len;c++) {
      const tile = document.createElement('div'); tile.className='tile'; tile.id=`tile-${r}-${c}`;
      tile.style.width=tileSize+'px'; tile.style.height=tileSize+'px'; tile.style.fontSize=fontSize+'rem';
      row.appendChild(tile);
    }
    grid.appendChild(row);
  }
}
function updateCurrentRow() {
  for (let c=0;c<currentWord.length;c++) {
    const tile = document.getElementById(`tile-${currentRow}-${c}`);
    if (c<currentGuess.length) { tile.textContent=currentGuess[c]; tile.classList.add('filled'); }
    else { tile.textContent=''; tile.classList.remove('filled'); }
  }
}
function revealRow(guess) {
  const result = scoreLetter(guess, currentWord);
  for (let c=0;c<currentWord.length;c++) {
    const tile = document.getElementById(`tile-${currentRow}-${c}`);
    setTimeout(()=>{ tile.classList.add('flip'); setTimeout(()=>{ tile.classList.add(result[c]); updateKeyState(guess[c],result[c]); renderKeyboard(); },250); },c*90);
  }
  return result;
}
function scoreLetter(guess, answer) {
  const len=answer.length, result=Array(len).fill('absent'), used=Array(len).fill(false);
  for (let i=0;i<len;i++) if (guess[i]===answer[i]) { result[i]='correct'; used[i]=true; }
  for (let i=0;i<len;i++) {
    if (result[i]==='correct') continue;
    for (let j=0;j<len;j++) { if (!used[j]&&guess[i]===answer[j]) { result[i]='present'; used[j]=true; break; } }
  }
  return result;
}
function updateKeyState(letter, state) {
  const p={correct:3,present:2,absent:1};
  if (!keyStates[letter]||p[state]>p[keyStates[letter]]) keyStates[letter]=state;
}

// ═══════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════
function buildKeyboard() {
  const kb=document.getElementById('keyboard'); kb.innerHTML='';
  KEYBOARD_ROWS.forEach(row=>{
    const rowEl=document.createElement('div'); rowEl.className='key-row';
    row.forEach(k=>{
      const btn=document.createElement('button');
      btn.className='key'+(k.length>1?' wide':''); btn.textContent=k; btn.id=`key-${k}`;
      btn.onclick=()=>handleKey(k); rowEl.appendChild(btn);
    }); kb.appendChild(rowEl);
  });
  window.onkeydown=(e)=>{
    if (e.key==='Enter') handleKey('ENTER');
    else if (e.key==='Backspace') handleKey('⌫');
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
  };
}
function renderKeyboard() {
  Object.entries(keyStates).forEach(([l,s])=>{
    const btn=document.getElementById(`key-${l}`);
    if (btn){btn.classList.remove('correct','present','absent');btn.classList.add(s);}
  });
}

// ═══════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════
function handleKey(key) {
  if (gameOver) return;
  if (key==='⌫'){if(currentGuess.length>0){currentGuess=currentGuess.slice(0,-1);updateCurrentRow();}return;}
  if (key==='ENTER'){submitGuess();return;}
  if (/^[A-Z]$/.test(key)&&currentGuess.length<currentWord.length){
    currentGuess+=key; updateCurrentRow();
    const tile=document.getElementById(`tile-${currentRow}-${currentGuess.length-1}`);
    tile.classList.remove('pop'); void tile.offsetWidth; tile.classList.add('pop');
  }
}

async function submitGuess() {
  if (currentGuess.length<currentWord.length){shakeRow(currentRow);setMessage(`Need ${currentWord.length} letters!`,'hint');return;}
  const result=revealRow(currentGuess);
  const won=result.every(r=>r==='correct');
  const guessSnap=currentGuess;
  document.getElementById('triesDisplay').textContent=`Tries: ${currentRow+1} / ${maxRows}`;
  const delay=currentWord.length*90+350;

  if (!won) {
    getSpellingHint(currentWord, guessSnap, result).then(hint=>{
      if (hint&&!gameOver){
        document.getElementById('hintText').textContent=hint;
        const box=document.getElementById('hintBox');
        box.classList.remove('hidden'); box.style.animation='none'; void box.offsetWidth; box.style.animation='';
      }
    });
  }

  setTimeout(()=>{
    if (won){
      document.getElementById(`row-${currentRow}`).classList.add('bounce-row');
      document.getElementById('hintBox').classList.add('hidden');
      const msgs=['🌟 Brilliant!','🎉 Amazing!','⭐ Superstar!','🏆 Perfect!','🥳 You got it!'];
      setMessage(msgs[Math.floor(Math.random()*msgs.length)],'success');
      results.push({word:currentWord,solved:true,tries:currentRow+1});
      upsertWordBank(currentWord, wordData[currentWord]||{}, true);
      gameOver=true; showNextOrFinish();
    } else {
      currentRow++; currentGuess='';
      if (currentRow>=maxRows){
        setMessage(`The word was: ${currentWord}`,'fail');
        results.push({word:currentWord,solved:false,tries:maxRows});
        upsertWordBank(currentWord, wordData[currentWord]||{}, false);
        gameOver=true; showNextOrFinish();
      } else { setMessage('',''); }
    }
  }, delay);
}

function shakeRow(row){const el=document.getElementById(`row-${row}`);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function setMessage(text,type){const el=document.getElementById('message');el.textContent=text;el.className='message '+(text?type:'empty');}
function showNextOrFinish(){
  if (wordIndex<wordList.length-1){document.getElementById('nextBtn').classList.remove('hidden');}
  else{setTimeout(showFinish,900);}
}
function nextWord(){wordIndex++;loadWord();}

// ═══════════════════════════════════════════
// FINISH SCREEN
// ═══════════════════════════════════════════
function showFinish(){
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('finishScreen').classList.remove('hidden');
  const solved=results.filter(r=>r.solved).length, total=results.length, pct=solved/total;
  document.getElementById('finishStars').textContent=pct===1?'⭐⭐⭐':pct>=0.66?'⭐⭐':pct>=0.33?'⭐':'';
  const msgs=pct===1?'Perfect score — you nailed every word! 🎊':pct>=0.66?'Great effort — most words cracked! 💪':pct>=0.33?'Good try — keep practising those tricky ones! 📚':'Keep going — practice makes perfect! 🌱';
  document.getElementById('finishMessage').textContent=`${solved} of ${total} words solved. ${msgs}`;
  document.getElementById('resultsGrid').innerHTML=results.map(r=>`
    <div class="result-row">
      <span class="result-word">${r.word}</span>
      <span class="result-score">${r.solved?'✅ '+r.tries+(r.tries===1?' try':' tries'):'❌ not solved'}</span>
    </div>`).join('');
  renderHistoryPanel();
}
function goHome(){
  wordList=[];wordData={};renderSetupChips();
  document.getElementById('startBtn').disabled=true;
  document.getElementById('finishScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
  document.getElementById('historyPanel').classList.remove('hidden');
  renderHistoryPanel(); window.onkeydown=null;
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderHistoryPanel();
</script>
